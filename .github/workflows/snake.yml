name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Theus090
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238A2BE2&color_dots=%230D1117,%2300441B,%23006D2C,%2300A83B,%2300D94F
            dist/github-contribution-grid-snake-dark.svg?color_snake=%238A2BE2&color_dots=%230D1117,%2300441B,%23006D2C,%2300A83B,%2300D94F

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
